{{define "content"}}
<h1>Environment Management</h1>

<div x-data="{ showForm: false }">
    <button @click="showForm = !showForm" class="contrast">
        <span x-show="!showForm">+ Add Environment</span>
        <span x-show="showForm">Cancel</span>
    </button>

    <div x-show="showForm" x-transition>
        <article>
            <form hx-post="/admin/environments" hx-target="#environments-list" hx-swap="outerHTML">
                <div class="grid">
                    <label>
                        Name
                        <input type="text" name="name" required placeholder="e.g., production">
                    </label>
                    <label>
                        Color
                        <input type="color" name="color" value="#6b7280">
                    </label>
                </div>
                <label>
                    Description
                    <textarea name="description" rows="2" placeholder="Environment description"></textarea>
                </label>
                <label>
                    Display Order
                    <input type="number" name="display_order" value="0">
                </label>
                <button type="submit">Create Environment</button>
            </form>
        </article>
    </div>
</div>

<h2>Environments</h2>
<div id="environments-list">
    {{if .Environments}}
    <table role="grid">
        <thead>
            <tr>
                <th>Color</th>
                <th>Name</th>
                <th>Description</th>
                <th>Order</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {{range .Environments}}
            <tr id="env-{{.ID}}">
                <td>
                    <span style="display: inline-block; width: 20px; height: 20px; background-color: {{.Color}}; border-radius: 4px;"></span>
                </td>
                <td>{{.Name}}</td>
                <td>{{.Description}}</td>
                <td>{{.DisplayOrder}}</td>
                <td>
                    <button class="outline" hx-delete="/admin/environments?id={{.ID}}" hx-target="#env-{{.ID}}" hx-swap="outerHTML" hx-confirm="Delete this environment?">
                        Delete
                    </button>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
    {{else}}
    <p>No environments yet.</p>
    {{end}}
</div>
{{end}}
