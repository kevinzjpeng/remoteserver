<tr id="env-{{.Environment.ID}}">
    <td colspan="5">
        <form hx-put="/admin/environments?id={{.Environment.ID}}" hx-swap="outerHTML" hx-target="#env-{{.Environment.ID}}">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Name</label>
                    <input type="text" name="name" value="{{.Environment.Name}}" required style="width: 100%;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Color</label>
                    <input type="color" name="color" value="{{.Environment.Color}}" style="width: 100%; height: 38px;">
                </div>
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Description</label>
                <textarea name="description" rows="2" style="width: 100%;">{{.Environment.Description}}</textarea>
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Display Order</label>
                <input type="number" name="display_order" value="{{.Environment.DisplayOrder}}" style="width: 100px;">
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px;">Save</button>
                <button type="button" class="secondary outline" hx-get="/admin/environments" hx-target="body" hx-swap="innerHTML">Cancel</button>
            </div>
        </form>
    </td>
</tr>
