<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Terminal - Server Access Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/css/xterm.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1e1e1e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #header {
            background: #2d2d2d;
            color: #fff;
            padding: 10px 20px;
            border-bottom: 1px solid #444;
        }
        #header h1 {
            margin: 0;
            font-size: 18px;
        }
        #terminal-container {
            height: calc(100vh - 50px);
            background: #000;
        }
        #status {
            position: fixed;
            top: 60px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 1000;
        }
        .status-connected {
            background: #28a745;
            color: #fff;
        }
        .status-disconnected {
            background: #dc3545;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1 id="server-name">SSH Terminal</h1>
    </div>
    <div id="status" class="status-connected">Connected</div>
    <div id="terminal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.8.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.9.0/lib/addon-web-links.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const serverId = urlParams.get('server_id');
        const serverName = urlParams.get('server_name') || 'SSH Terminal';

        document.getElementById('server-name').textContent = serverName;

        // Initialize terminal
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: 'Monaco, Menlo, "Ubuntu Mono", monospace',
            theme: {
                background: '#000000',
                foreground: '#ffffff',
                cursor: '#ffffff',
                cursorAccent: '#000000',
                selection: '#444444'
            }
        });

        const fitAddon = new FitAddon.FitAddon();
        const webLinksAddon = new WebLinksAddon.WebLinksAddon();

        term.loadAddon(fitAddon);
        term.loadAddon(webLinksAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        // Connect to WebSocket
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws/terminal?server_id=${serverId}`;
        const ws = new WebSocket(wsUrl);

        const statusEl = document.getElementById('status');

        ws.onopen = function() {
            statusEl.textContent = 'Connected';
            statusEl.className = 'status-connected';
            term.focus();
        };

        ws.onmessage = function(event) {
            term.write(event.data);
        };

        ws.onerror = function(error) {
            console.error('WebSocket error:', error);
            statusEl.textContent = 'Error';
            statusEl.className = 'status-disconnected';
        };

        ws.onclose = function() {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'status-disconnected';
            term.write('\r\n\x1b[31mConnection closed\x1b[0m\r\n');
        };

        // Send terminal input to WebSocket
        term.onData(function(data) {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(data);
            }
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            fitAddon.fit();
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'resize',
                    cols: term.cols,
                    rows: term.rows
                }));
            }
        });

        // Handle keyboard shortcuts
        term.attachCustomKeyEventHandler(function(arg) {
            if (arg.ctrlKey && arg.key === 'c' && term.hasSelection()) {
                return false;
            }
            return true;
        });
    </script>
</body>
</html>
