<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Server Access Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-container h1 {
            margin-bottom: 1rem;
            color: #24292e;
        }
        .login-container p {
            color: #586069;
            margin-bottom: 2rem;
        }
        .github-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #24292e;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .github-btn:hover {
            background: #2f363d;
        }
        .github-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        .logout-section {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #e1e4e8;
        }
        .logout-btn {
            background: none;
            border: 1px solid #d1d5da;
            color: #586069;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #fafbfc;
            border-color: #959da5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🖥️ Server Access Manager</h1>
        <p>Sign in with your GitHub account to continue</p>
        <a href="/auth/github" class="github-btn">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.04.58 1.18.81.69 1.17 1.8 1.28 2.16.12.37.15.88.03 1.36.12.47.66 1.1 1.4 1.28.74.17 1.37-.15 1.57-.45.2-.3.37-.88.37-1.49 0-.61-.2-1.09-.37-1.36-.34-.58-.94-1.13-1.57-1.28-.63-.15-.03-.92.37-.53.34.15.68.52.82 1.13.15.45.81 1.55 1.69 1.41.88-.14 1.4-.81 1.69-1.41.29-.61.37-1.18.37-1.79 0-.61-.2-1.09-.37-1.36-.34-.58-.94-1.13-1.57-1.28-.63-.15-.03-.92.37-.53.34.15.68.52.82 1.13.15.45.81 1.55 1.69 1.41.88-.14 1.4-.81 1.69-1.41.29-.61.37-1.18.37-1.79 0-.61-.2-1.09-.37-1.36-.34-.58-.94-1.13-1.57-1.28z"></path>
            </svg>
            Sign in with GitHub
        </a>
        <div class="logout-section">
            <p style="font-size: 0.875rem; color: #586069;">Having trouble logging in?</p>
            <button class="logout-btn" onclick="clearSession()">Clear Session & Retry</button>
        </div>
    </div>

    <script>
        function clearSession() {
            // Clear all cookies
            document.cookie.split(";").forEach(function(c) {
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
            });
            // Redirect to login
            window.location.href = '/login';
        }
    </script>
</body>
</html>
