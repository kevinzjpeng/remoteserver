<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Server Access Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-container h1 {
            margin-bottom: 1rem;
            color: #24292e;
        }
        .login-container p {
            color: #586069;
            margin-bottom: 2rem;
        }
        .github-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #24292e;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        .github-btn:hover {
            background: #2f363d;
        }
        .github-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        .logout-section {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #e1e4e8;
        }
        .logout-btn {
            background: none;
            border: 1px solid #d1d5da;
            color: #586069;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #fafbfc;
            border-color: #959da5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🖥️ Server Access Manager</h1>
        <p>Sign in with your GitHub account to continue</p>
        <a href="/auth/github" class="github-btn">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59 0.4 0.07 0.55 -0.17 0.55 -0.38 0 -0.19 -0.01 -0.82 -0.01 -1.49 -2.01 0.37 -2.53 -0.49 -2.69 -0.94 -0.09 -0.23 -0.48 -0.94 -0.82 -1.13 -0.28 -0.15 -0.68 -0.52 -0.01 -0.53 0.63 -0.01 1.04 0.58 1.18 0.81 0.69 1.17 1.8 1.28 2.16 0.12 0.37 0.15 0.88 0.03 1.36 0.12 0.47 0.66 1.1 1.4 1.28 0.74 0.17 1.37 -0.15 1.57 -0.45 0.2 -0.3 0.37 -0.88 0.37 -1.49 0 -0.61 -0.2 -1.09 -0.37 -1.36 -0.34 -0.58 -0.94 -1.13 -1.57 -1.28 -0.63 -0.15 -0.03 -0.92 0.37 -0.53 0.34 0.15 0.68 0.52 0.82 1.13 0.15 0.45 0.81 1.55 1.69 1.41 0.88 -0.14 1.4 -0.81 1.69 -1.41 0.29 -0.61 0.37 -1.18 0.37 -1.79 0 -0.61 -0.2 -1.09 -0.37 -1.36 -0.34 -0.58 -0.94 -1.13 -1.57 -1.28 -0.63 -0.15 -0.03 -0.92 0.37 -0.53 0.34 0.15 0.68 0.52 0.82 1.13 0.15 0.45 0.81 1.55 1.69 1.41 0.88 -0.14 1.4 -0.81 1.69 -1.41 0.29 -0.61 0.37 -1.18 0.37 -1.79 0 -0.61 -0.2 -1.09 -0.37 -1.36 -0.34 -0.58 -0.94 -1.13 -1.57 -1.28z"></path>
            </svg>
            Sign in with GitHub
        </a>
        <div class="logout-section">
            <p style="font-size: 0.875rem; color: #586069;">Having trouble logging in?</p>
            <button class="logout-btn" onclick="clearSession()">Clear Session & Retry</button>
        </div>
    </div>

    <script>
        function clearSession() {
            // Clear all cookies
            document.cookie.split(";").forEach(function(c) {
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
            });
            // Redirect to login
            window.location.href = '/login';
        }
    </script>
</body>
</html>
